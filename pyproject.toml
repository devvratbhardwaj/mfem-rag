[project]
name = "mfem-rag"
version = "0.1.0"
description = "A retrieval and evaluation harness for technical software documentation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "langchain-text-splitters>=1.1.2",
    "markdownify>=1.2.3",
    "ollama>=0.6.2",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "qdrant-client>=1.19.1",
    "tokenizers>=0.22.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
